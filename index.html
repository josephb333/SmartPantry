<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SmartPantry Prototype</title>
    <meta name="color-scheme" content="light">
    <meta name="theme-color" content="#28745c">
    <!-- first paint happens before the external stylesheets arrive — the
         canvas must already be the app's page tone, not the browser's
         dark-mode default -->
    <style>html { background-color: #f5f7f8; }</style>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js" defer></script>
  </head>
  <body>
    <main class="app-shell">
      <header class="app-header">
        <div>
          <p class="eyebrow">SmartPantry</p>
          <h1 id="pageTitle">Home</h1>
        </div>
        <button class="icon-button" type="button" data-view="upload" aria-label="Upload receipt">+</button>
        <button id="resetBtn" class="icon-button" type="button" aria-label="Reset demo data">↺</button>
      </header>

      <section id="homeView" class="view active" aria-labelledby="pageTitle">
        <div class="summary-grid">
          <button class="summary-card urgent" type="button" data-filter-status="Buy Now" data-view="pantry">
            <span id="buyNowCount">0</span>
            <small>Buy now</small>
          </button>
          <button class="summary-card soon" type="button" data-filter-status="Buy Soon" data-view="pantry">
            <span id="buySoonCount">0</span>
            <small>Buy soon</small>
          </button>
          <button class="summary-card stocked" type="button" data-filter-status="In Stock" data-view="pantry">
            <span id="stockedCount">0</span>
            <small>Stocked</small>
          </button>
        </div>

        <div class="action-stack">
          <button class="primary-action" type="button" data-view="upload">
            <span>Upload Receipt</span>
            <small>Add purchased items from a receipt photo</small>
          </button>
          <button class="secondary-action" type="button" data-view="list">
            <span>Generate Grocery List</span>
            <small>Use low stock and predicted needs</small>
          </button>
        </div>

        <section class="section-block">
          <div class="section-heading">
            <h2>Needs Attention</h2>
            <button id="attentionViewAll" class="text-button" type="button" data-view="pantry">View all</button>
          </div>
          <div id="attentionItems" class="item-list"></div>
        </section>
      </section>

      <section id="uploadView" class="view">
        <div class="scan-panel">
          <div id="receiptCard" class="receipt-card">
            <div class="receipt-empty">
              <div class="receipt-line wide"></div>
              <div class="receipt-line"></div>
              <div class="receipt-line short"></div>
              <div class="receipt-dash"></div>
              <p class="receipt-cta">Add receipt photo</p>
            </div>
            <img id="receiptPreview" alt="Receipt preview">
            <div class="receipt-sources">
              <label class="source-button primary">
                <input id="receiptCameraInput" type="file" accept="image/*" capture="environment" class="sr-only-input">
                Take photo
              </label>
              <label class="source-button">
                <input id="receiptLibraryInput" type="file" accept="image/*" class="sr-only-input">
                Choose from library
              </label>
            </div>
          </div>
          <button id="scanReceiptBtn" class="primary-action compact" type="button" disabled>Scan receipt</button>
        </div>

        <section class="section-block">
          <div class="section-heading">
            <h2>Detected Items</h2>
            <span id="scanStatus" class="status-pill stocked">Ready</span>
          </div>
          <div class="gray-box">
            <div id="detectedItems" class="item-list"></div>
            <button id="addDetectedBtn" class="mini-button" type="button">
              <span class="cta-title">Everything look good?</span>
              <span class="cta-sub">Add detected items to pantry</span>
            </button>
          </div>
        </section>
      </section>

      <section id="pantryView" class="view">
        <label id="pantrySearch" class="search-box">
          <span>Search</span>
          <input id="searchInput" type="search" class="form-control" placeholder="Search items">
        </label>
        <div id="pantryFilters" class="filter-row" role="group" aria-label="Pantry filters">
          <button class="filter-chip active" type="button" data-category="All">All</button>
          <button class="filter-chip" type="button" data-category="Produce">Produce</button>
          <button class="filter-chip" type="button" data-category="Dairy">Dairy</button>
          <button class="filter-chip" type="button" data-category="Protein">Protein</button>
          <button class="filter-chip" type="button" data-category="Bakery">Bakery</button>
          <button class="filter-chip" type="button" data-category="Frozen">Frozen</button>
          <button class="filter-chip" type="button" data-category="Breakfast">Breakfast</button>
          <button class="filter-chip" type="button" data-category="Snacks">Snacks</button>
          <button class="filter-chip" type="button" data-category="Beverages">Beverages</button>
          <button class="filter-chip" type="button" data-category="Pantry">Pantry</button>
          <button class="filter-chip" type="button" data-category="Household">Household</button>
          <button class="filter-chip" type="button" data-category="Personal Care">Personal Care</button>
        </div>
        <div id="pantryItems" class="grouped-list"></div>

        <form id="addItemForm" class="add-form">
          <h2>Add Item Manually</h2>
          <input id="newItemName" class="form-control" required placeholder="Item name">
          <div class="form-grid">
            <select id="newItemCategory" class="form-select">
              <option>Produce</option>
              <option>Dairy</option>
              <option>Protein</option>
              <option>Bakery</option>
              <option>Frozen</option>
              <option>Breakfast</option>
              <option>Snacks</option>
              <option>Beverages</option>
              <option>Pantry</option>
              <option>Household</option>
              <option>Personal Care</option>
            </select>
            <select id="newItemStatus" class="form-select">
              <option>In Stock</option>
              <option>Running Low</option>
              <option>Buy Soon</option>
              <option>Buy Now</option>
            </select>
          </div>
          <button class="primary-action compact" type="submit">Add Item</button>
        </form>
      </section>

      <section id="listView" class="view">
        <section class="section-block">
          <div class="section-heading">
            <h2>Your list.</h2>
          </div>
          <form id="quickAddForm" class="list-add">
            <input id="extraItemName" class="form-control" required placeholder="+ Add an item...">
          </form>
          <div id="groceryItems" class="item-list check-list"></div>
          <div id="listExplainer" class="list-explainer gray-box">
            <p>Add by hand — or scan a receipt.</p>
            <p>Every scan teaches the pantry what you buy.</p>
            <p>The more it knows, the less you type.</p>
          </div>
        </section>

        <section id="suggestedSection" class="section-block">
          <div class="section-heading">
            <h2>Suggested</h2>
            <span class="status-pill soon">Based on habits</span>
          </div>
          <div id="suggestedItems" class="item-list"></div>
        </section>
        <button id="createListBtn" class="primary-action compact full" type="button">Create List</button>
      </section>
    </main>

    <nav class="bottom-nav" aria-label="Primary">
      <button class="nav-item active" type="button" data-view="home">Home</button>
      <button class="nav-item" type="button" data-view="upload">Upload</button>
      <button class="nav-item" type="button" data-view="pantry">Pantry</button>
      <button class="nav-item" type="button" data-view="list">List</button>
    </nav>

    <div id="toast" class="toast-message" role="status" aria-live="polite"></div>
    <script src="app.js"></script>
  </body>
</html>
